
{% extends "base.html" %}
{% block content %}

<h2>Analytics</h2>

<!-- Traffic Usage Chart -->
<div class="panel">
  <h3>Traffic Usage (bytes per day)</h3>
  <canvas id="trafficChart" height="90"></canvas>
</div>

<!-- Protocol Usage and Alert Severity Charts -->
<div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px;">

  <div class="panel" style="flex: 1; min-width: 300px;">
    <h3>Protocol Usage</h3>
    <canvas id="protoChart"></canvas>
  </div>

  <div class="panel" style="flex: 1; min-width: 300px;">
    <h3>Alert Severity Distribution</h3>
    <canvas id="riskChart"></canvas>
  </div>

</div>

<!-- Current Device Risk Levels Chart -->
<div class="panel" style="margin-top: 20px;">
  <h3>Current Device Risk Levels</h3>

  <p style="color: #94a3b8;">
    Current risk distribution of registered devices on the local network,
    including offline devices.
  </p>

<div style="width: 100%; max-width: 700px; height: 300px; margin: 20px auto;">
    <canvas id="deviceRiskChart"></canvas>
</div>

<!-- Chart.js Library -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  // 1. Daily Traffic Usage
  new Chart(document.getElementById("trafficChart"), {
    type: "line",
    data: {
      labels: {{ traffic_labels|tojson }},
      datasets: [{
        label: "Bytes",
        data: {{ traffic_values|tojson }},
        borderColor: "#38bdf8",
        backgroundColor: "rgba(56, 189, 248, 0.12)",
        borderWidth: 2,
        fill: true,
        tension: 0.3,
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

  // 2. Protocol Usage
  new Chart(document.getElementById("protoChart"), {
    type: "doughnut",
    data: {
      labels: {{ proto_labels|tojson }},
      datasets: [{
        data: {{ proto_values|tojson }},
        backgroundColor: [
          "#38bdf8",
          "#a78bfa",
          "#f59e0b",
          "#94a3b8",
          "#34d399"
        ],
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: "top"
        }
      }
    }
  });

  // 3. Historical Alert Severity Distribution
  new Chart(document.getElementById("riskChart"), {
    type: "bar",
    data: {
      labels: ["Low", "Medium", "High", "Critical"],
      datasets: [{
        label: "Alerts",
        data: {{ risk_values|tojson }},
        backgroundColor: [
          "#16a34a",
          "#eab308",
          "#ea580c",
          "#dc2626"
        ],
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            precision: 0
          }
        }
      }
    }
  });

  // 4. Current Device Risk Levels
  new Chart(document.getElementById("deviceRiskChart"), {
    type: "bar",
    data: {
      labels: ["Low", "Medium", "High"],
      datasets: [{
        label: "Devices",
        data: {{ device_risk_values|default([0, 0, 0])|tojson }},
        backgroundColor: [
          "#16a34a",
          "#eab308",
          "#dc2626"
        ],
        borderRadius: 6,
        maxBarThickness: 90
      }]
    },
options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
        legend: {
            display: false
        }
    },
    scales: {
        y: {
            beginAtZero: true,
            ticks: {
                precision: 0,
                stepSize: 1
            }
        }
    }
}
  });

});
</script>

{% endblock %}
